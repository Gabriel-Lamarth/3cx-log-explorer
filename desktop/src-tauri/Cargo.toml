[package]
name = "threecx-log-explorer-desktop"
version = "0.3.0"
description = "Aplicação desktop local para análise de logs 3CX"
authors = ["3CX Log Explorer contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
threecx-log-explorer = { path = "../.." }
